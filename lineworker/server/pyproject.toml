[project]
name = "lineworker-server"
version = "0.1.0"
description = "LINEWORKER Workers' Comp claims console — API server"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "alembic>=1.18,<2.0",
    "pydantic-settings>=2.5",
    "structlog>=24.4",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    # Story 6.1. `pgvector.sqlalchemy.Vector` is the column type the three
    # embedding tables declare and the `<=>` operator the similarity search
    # orders by, so it is runtime code in `data/models/core.py` and
    # `data/repositories/embeddings.py` — not a test dependency, and not
    # optional: the models import it at module scope, so the api would not
    # start without it. The extension itself has been installed since
    # migration 0002; this is the Python side finally using it.
    "pgvector>=0.3",
    # Promoted from the dev group by Story 6.1. It was a test-only dependency
    # for as long as the only HTTP client in the tree was Starlette's test
    # client; `services/rag/client.py` is the first *runtime* caller — the one
    # module in the build that talks to Ollama's embeddings API (AD-5) — and a
    # runtime import resolved from a dev-only dependency is an ImportError in
    # the shipped image and nowhere else.
    "httpx>=0.27",
    # AD-8's rules engine, pinned exactly. A JDM document is data we commit,
    # seed and assert against: the engine that evaluates it is part of the
    # contract, not an interchangeable detail, so "any 0.53.x" is one patch
    # release away from a queue that ranks differently with no diff to
    # explain it. Moving it is a deliberate edit here plus a `uv lock`.
    "zen-engine==0.53.0",
    # The chat client's vendor stack (Story 6.2). A *range*, like every other
    # dependency here, and both ends are load-bearing. The floor is 1.1 rather
    # than the 0.2 this shipped with: `with_structured_output(method=
    # "json_schema")` — §5.3's prescription and the only reason this package is
    # in the build — does not exist before 0.3, so `>=0.2` resolved a version
    # that cannot run `agents/client.py` at all, and the ratified stack is 1.x.
    # The ceiling is the rule the rest of this list keeps: a major bump of a
    # LangChain package is a rewrite of the structured-output surface, not a
    # patch to pick up in a `uv lock` nobody read.
    "langchain-ollama>=1.1,<2",
    # The copilot spine's vendor stack (Story 6.3). Four packages, one range
    # each, and each range has a reason at both ends.
    #
    # `langgraph` is the runtime the one compiled `StateGraph` is built on
    # (AD-6). The floor is 1.2 because that is the line the spine ratified and
    # the line whose `AsyncPostgresSaver` DDL migration 0043 vendors; the
    # ceiling is 1.3 because **the checkpoint schema is frozen against the
    # pinned minor**. A 1.3 that adds a column would leave the saver writing
    # against tables that migration created and this project never updated,
    # which is a silent data failure rather than an import error — so the
    # ceiling here is a schema guard, not the usual caution about a rewrite.
    "langgraph>=1.2,<1.3",
    # The saver itself, and **the package that actually owns the frozen
    # schema**. `langgraph` above gets a minor ceiling because the checkpoint
    # schema is frozen against the pinned minor — but the schema is not
    # `langgraph`'s, it is this one's: migration 0043 vendors *this* package's
    # `setup()` output and freezes 3.1.2's exact ten-statement `MIGRATIONS`
    # list. So the same argument has to be applied here, and harder (review of
    # Story 6.3: it was written for `langgraph` and left as `<4` here, which
    # admitted every 3.x minor able to add an `ALTER TABLE` this project would
    # never run). The floor is 3.1.2 because that is the version the DDL was
    # generated from; the ceiling is 3.2 because a new minor may extend the
    # schema, and a saver writing against a column migration 0043 never created
    # is a silent data failure rather than an import error.
    #
    # `tests/test_copilot_migration.py` asserts the installed patch version
    # equals the one the migration names, so even a patch bump inside this range
    # fails loudly and in a test that names the file to change.
    "langgraph-checkpoint-postgres>=3.1.2,<3.2",
    # `AsyncPostgresSaver` takes an `AsyncConnectionPool`, which lives here
    # rather than in `psycopg` proper. Named explicitly rather than inherited
    # transitively because `api/app.py` imports it at the composition root: a
    # runtime import resolved from somebody else's dependency tree is an
    # `ImportError` the day that somebody drops it (`httpx`'s promotion in 6.1
    # is the same lesson).
    "psycopg-pool>=3.2,<4",
    # `langchain.agents.create_agent` — §5.2's prescribed tool-calling core and
    # the successor to the deprecated `langgraph.prebuilt.create_react_agent`.
    # The floor is v1 because that is where `create_agent` exists at all; the
    # ceiling is the rule the rest of this list keeps for a LangChain package.
    "langchain>=1.0,<2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "hypothesis>=6.112",
]

[tool.uv]
# Virtual project: top-level packages (api/, services/, data/, …) are imported
# from this directory directly; nothing is built into a wheel.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "api",
    "services",
    "rules",
    "agents",
    "data",
    "scripts",
    "config.py",
    "logging_config.py",
    "tests",
]

[[tool.mypy.overrides]]
module = ["asyncpg.*"]
ignore_missing_imports = true

# `zen` is a compiled pyo3 extension shipping no stubs and no py.typed, so
# strict mode cannot see through it. The override is scoped to the import,
# not to `rules/` — everything this project writes around the engine stays
# fully typed, and `rules/engine.py` is the single module that touches the
# untyped surface (which is why the boundary is validated in
# `rules/parameters.py` rather than left as `Any` at each call site).
[[tool.mypy.overrides]]
module = ["zen.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
