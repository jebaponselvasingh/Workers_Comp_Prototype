[alembic]
script_location = data
prepend_sys_path = .
version_path_separator = os
# Keeps `alembic revision` on the existing YYYYMMDD_slug.py convention instead
# of emitting a random hash and breaking the on-disk ordering.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(slug)s

# sqlalchemy.url is intentionally absent: data/env.py reads DATABASE_URL
# through the pydantic-settings module (config.py) — the single config surface.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
