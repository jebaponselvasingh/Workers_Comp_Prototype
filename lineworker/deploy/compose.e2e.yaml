# LINEWORKER e2e profile (AD-15) — identical topology to dev, but:
#   * DB is ephemeral (no volume) and gets the e2e-only owner role that the
#     per-spec reset runs under (the runtime app role must not be able to
#     drop schema once AD-4 grants land in Story 1.2+).
#   * web publishes 8081 so an e2e stack can run beside a dev stack.
#
#   docker compose -f deploy/compose.e2e.yaml up -d --build --wait
#   * the model server is `model-stub` (below): a deterministic,
#     Ollama-API-compatible container, so no model is ever downloaded and no
#     spec waits on inference. There is deliberately **no `ollama` service in
#     this file** — AD-5 and AD-14 govern dev and prod, and the stub exists
#     only here (`deploy/model-stub/`, outside `server/`, so it can never
#     ship).

name: lineworker-e2e

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "8081:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ../server
    environment:
      DATABASE_URL: postgresql://lineworker_app:lineworker_app_e2e@postgres:5432/lineworker
      ALEMBIC_DATABASE_URL: postgresql://lineworker:lineworker_e2e_stack@postgres:5432/lineworker
      APP_DB_PASSWORD: lineworker_app_e2e
      ENV: e2e
      LOG_LEVEL: INFO
      # The stub, not Ollama. The api runs the *real* `OllamaEmbeddingClient`
      # against it — nothing is swapped in Python — so an e2e run exercises the
      # shipped client, the shipped dimension check and the shipped refresh
      # command against fixed bytes.
      OLLAMA_BASE_URL: http://model-stub:11434
      # Named so the request body and `claim_embedding.model` carry a value that
      # says where the vectors came from. The stub answers whatever it is asked
      # for; the point is that a row embedded in the e2e profile is
      # distinguishable from one embedded by a real model.
      CHAT_MODEL: model-stub
      EMBEDDING_MODEL: model-stub
      # AD-5/AD-16 containment, and it is not a preference. `langchain-core`
      # hard-depends on `langsmith`, whose tracer activates from these variables
      # alone and exports the whole prompt body and the whole completion to
      # `api.smith.langchain.com` — a claim's clinical narrative leaving the
      # network with no code in this repository to grep for. `config.py` forces
      # them off at import; they are repeated here so the container is closed
      # even before Python starts, and because `environment:` outranks the
      # `env_file:` above, where an inherited value would otherwise land.
      # All six names `config.py::_TRACING_ENV_OFF` forces, not a subset:
      # `langsmith.utils.get_env_var` reads the `LANGSMITH_*` spelling first and
      # falls back to `LANGCHAIN_*`, and `*_OTEL_ENABLED` is a second exporter —
      # so three of them left the door the comment above claims is closed only
      # half shut (follow-up review of Story 6.2, C5). The import-time overwrite
      # covers them either way; this is the layer that does not depend on any
      # Python having run.
      LANGSMITH_TRACING: "false"
      LANGSMITH_TRACING_V2: "false"
      LANGCHAIN_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_OTEL_ENABLED: "false"
      LANGCHAIN_OTEL_ENABLED: "false"
    volumes:
      # The blob volume, read-write here and read-only in `backup` — the dev
      # profile's mount, at the same container path, so the two profiles teach
      # the same habit (Story 8.3). A bind mount rather than a named volume for
      # this file's usual reason: the e2e stack keeps no state between runs, and
      # `e2e/.tmp/` is what the Playwright process can read from the host.
      - ../e2e/.tmp/blobs:/var/lib/lineworker/blobs
    depends_on:
      postgres:
        condition: service_healthy
      model-stub:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  postgres:
    build:
      context: ./postgres
    image: lineworker/postgres:pg18-pgaudit
    # Ephemeral: no volume. Internal network only, no published port.
    #
    # The flag list below is **byte-identical to `compose.yaml`'s** and that is
    # the whole point of it being here (Story 8.2): AD-11's posture is applied
    # in every profile by the same mechanism, so the gate runs against the
    # hardened configuration rather than against a stock database that happens
    # to pass. The argument for each flag is written out once, over there.
    #
    # Identical is asserted, not hoped for:
    # `server/tests/test_deploy_tls_posture.py::
    # test_every_profile_starts_postgres_with_the_same_hardening_flags` drives
    # one tuple across all three compose files, so a flag added to one and
    # forgotten in the others fails the server suite.
    #
    # TLS is **not** here. Story 1.1's plain-HTTP decision stands for dev and
    # e2e, and the suite drives `http://localhost:8081`; the TLS material lives
    # in `compose.prod.yaml` alone.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - pgaudit.log=ddl,role
      - -c
      - pgaudit.log_catalog=off
      - -c
      - pgaudit.log_parameter=off
      - -c
      - pgaudit.log_relation=off
      - -c
      - pgaudit.log_statement_once=on
      - -c
      - log_statement=none
      - -c
      - log_duration=off
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - logging_collector=on
      - -c
      - log_destination=stderr
      - -c
      - log_directory=log
      - -c
      - log_filename=postgresql-%a.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=0
      - -c
      - log_truncate_on_rotation=on
      - -c
      - max_slot_wal_keep_size=2GB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: lineworker
      POSTGRES_PASSWORD: lineworker_e2e_stack
      POSTGRES_DB: lineworker
    volumes:
      - ./e2e-init:/docker-entrypoint-initdb.d:ro
      # Client authentication, pointed at by `-c hba_file=` above. Mounted
      # rather than baked or appended for the reason that file argues at
      # length: an `initdb` hook applies only when the data directory is
      # created, so the record permitting the backup container's replication
      # connection would never appear on a `pgdata` volume that already exists,
      # and the drift would be invisible (Story 8.3).
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineworker -d lineworker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backup:
    # A base backup of a real database takes minutes, and compose's default
    # stop timeout is ten seconds — so `down` during the nightly window used to
    # SIGKILL the run, which skips every trap and leaves the plaintext staging
    # directory behind (both `entrypoint.sh` and `backup.sh` now sweep it, but
    # not having written it is better). Five minutes lets a run reach its own
    # signal handler, write `status.json` as a failure, and remove its plaintext
    # before the kernel takes over.
    stop_grace_period: 300s
    build:
      context: ./backup
    image: lineworker/backup:pg18
    # The same service, the same image and the same mechanism as dev and prod —
    # Story 8.2's anti-drift rule, applied to the backup pipeline. What differs
    # is confined to what must: no WAL receiver, no scheduler, and a destination
    # and status directory the Playwright process can read from the host.
    # `server/tests/test_backup_posture.py` fails when the three profiles
    # disagree about anything else.
    #
    # `profiles: ["backup"]` so `up -d --build --wait` never waits on it. That
    # is not a workaround: this service in this profile is a **one-shot** job
    # driven by `e2e/stories/8-3-…spec.ts` through
    # `compose("run", "--rm", "backup", "once")`, and `run` starts a service
    # regardless of its profiles. A backup container left running here would
    # hold a replication slot against a database every spec file drops the
    # schema of.
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      BACKUP_DATABASE_URL: postgresql://lineworker:lineworker_e2e_stack@postgres:5432/lineworker
      # **A real age recipient, committed in the clear, for which no identity
      # exists in this repository, on any developer's machine, or anywhere
      # else.** It was minted by `age-keygen` inside a throwaway container whose
      # private half was never written to a file and whose container is gone.
      # That is not a shortcut — it is the property being demonstrated. The spec
      # asserts that the shipped artifact is `age` ciphertext and is *not* a
      # plaintext `PGDMP` dump; it never decrypts anything, because nothing
      # could. If a future story needs a decrypting e2e assertion it must mint a
      # throwaway keypair at run time (as `tests/test_backup_restore.py` does)
      # rather than commit an identity here.
      BACKUP_AGE_RECIPIENT: age1nc2t7reyk8r44l8n8aqtz35uryvr3hwqnle67v3aww39nwk4fg5qt6pywe
      # "Off-host" is a local scratch directory under the same bind mount, so
      # the spec can assert the run really landed at the destination. The
      # transport is not exercised — see `deploy/RESTORE-DRILL.md`, which says
      # so rather than implying an SSH copy was proven — but the `rsync`
      # invocation, the per-run directory layout and the remote prune all are.
      BACKUP_REMOTE: /var/lib/lineworker/backup/offhost
      BACKUP_AT: "02:30"
      BACKUP_KEEP_RUNS: "3"
      BACKUP_MAX_AGE_HOURS: "26"
      # **Off, and this is the one place it is.** `pg_receivewal` holds a
      # physical replication slot, and this profile's database has its schema
      # dropped and re-migrated before every spec file. A slot here would be
      # abandoned by construction the moment the one-shot container exited.
      BACKUP_WAL: "off"
      BACKUP_SSH_KEY: /etc/lineworker/backup-ssh/id_backup
    volumes:
      # Bind mounts, not named volumes: the Playwright process reads
      # `status.json` and the shipped artifact's first bytes straight off the
      # host filesystem, which is the only way a spec can see inside a container
      # that publishes nothing. `lineworker/.gitignore` ignores `e2e/.tmp/`.
      - ../e2e/.tmp/backup:/var/lib/lineworker/backup
      - ../e2e/.tmp/blobs:/var/lib/lineworker/blobs:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

  model-stub:
    build:
      context: ./model-stub
    # No ports: — the same rule the real `ollama` service keeps in
    # `compose.yaml`, kept here too so the two profiles cannot teach different
    # habits. Reachable from `api` on the compose network and nowhere else.
    #
    # No volume and no GPU: the stub holds no models and computes its vectors
    # from a hash, so it starts in under a second and a `down -v` costs nothing.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:11434/api/version', timeout=3)"
      interval: 5s
      timeout: 5s
      retries: 10
      # Seconds rather than the dev profile's thirty minutes: there is nothing
      # to download, so a stub that is not up in half a minute is broken rather
      # than busy.
      start_period: 10s
