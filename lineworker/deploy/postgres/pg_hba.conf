# Client authentication for every profile (Story 8.3).
#
# ## Why this file exists at all
#
# Story 8.3's backup container runs `pg_basebackup` and `pg_receivewal`, both of
# which open a **physical replication connection**. The official Postgres image's
# entrypoint appends exactly one network record to the `pg_hba.conf` that
# `initdb` generated:
#
#     host all all all scram-sha-256
#
# and `all` in the database column does **not** match a physical replication
# connection — PostgreSQL treats `replication` as a distinct pseudo-database, and
# `initdb`'s own replication records are scoped to `local` and to loopback. The
# backup container is neither. Verified rather than reasoned about: without the
# record at the bottom of this file, `pg_receivewal` from another container fails
# with
#
#     FATAL: no pg_hba.conf entry for replication connection from host
#            "172.17.0.1", user "lineworker", no encryption
#
# So the spec's Design Note 1 — "`pg_receivewal` … needs no change to the
# postgres service beyond the retention bound" — is one record short of true in
# this deployment, and this file is that record. It adds **no role, no grant and
# no privilege**: the `lineworker` owner role already carries REPLICATION (it is
# the bootstrap superuser the image creates), and AD-4's two-role posture, the
# `lineworker_app` grants and the `audit_redactor` policies are all untouched.
# What changes is that the attribute the role already has is reachable over the
# internal network instead of only over the container's own socket.
#
# ## Why it is mounted and named by `-c hba_file=`, not baked or appended
#
# The same argument Story 8.2 makes for the hardening `command:` list, and it is
# the argument that rules out every other mechanism here:
#
#   * An `initdb` hook (a script in `/docker-entrypoint-initdb.d`) runs only when
#     the data directory is created. The dev `pgdata` volume already exists, so
#     the record would never appear there and the drift would be invisible —
#     exactly the failure mode Design Note 1 of Story 8.2 rejects.
#   * `ALTER SYSTEM` cannot express an hba record at all.
#   * Editing `$PGDATA/pg_hba.conf` in place means a mutable file inside the data
#     volume whose contents depend on when the volume was created.
#
# `-c hba_file=/etc/postgresql/pg_hba.conf` applies on **every** start regardless
# of the volume's age, is greppable as text (which is how
# `server/tests/test_backup_posture.py` and `test_deploy_tls_posture.py` both
# work), and makes a weakened record a reviewable one-line diff. The cost is that
# this file replaces `$PGDATA/pg_hba.conf` wholesale and therefore owns every
# record in it — which is why `initdb`'s own six defaults are restated below
# rather than inherited. That cost is paid by the posture test, which fails when
# this file stops permitting replication or starts permitting `trust` from the
# network.
#
# ## What each record is for
#
# The first six are `initdb`'s own, restated verbatim: the container's unix
# socket and loopback, for both `all` and `replication`, which is what the
# image's entrypoint uses to bootstrap the database, run
# `/docker-entrypoint-initdb.d`, and answer `pg_isready` in the compose
# healthcheck. `trust` on them is the image's own posture and narrowing it here
# would break the entrypoint before anything else noticed. An earlier draft of
# this file dropped the two loopback *replication* rows while its own comment
# claimed to restate the defaults verbatim — harmless (narrower), but a comment
# that is not true about the file under it is worse than no comment.
#
# The last two are the network. `scram-sha-256`, matching what the entrypoint
# would have appended, so no profile's credentials change. **`host` and not
# `hostssl`** on both: the prod overlay's `ssl=on` *permits* TLS rather than
# requiring it, and that is a pre-existing recorded deferral (see
# `deferred-work.md`, Story 8.2 review) about how the prod database
# authenticates. Turning these two records into `hostssl` here would close it —
# and would also, in the same edit and with no test to notice, break dev and e2e,
# which have no certificates at all. That change belongs to Story 8.4's
# prod-profile completion together with the rest of the decision.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
host    all             all             all                     scram-sha-256
host    replication     all             all                     scram-sha-256
