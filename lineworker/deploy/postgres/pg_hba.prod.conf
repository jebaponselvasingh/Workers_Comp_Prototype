# Client authentication for the PRODUCTION profile only (Story 8.4).
#
# Mounted over `/etc/postgresql/pg_hba.conf` by `compose.prod.yaml` — the same
# container path `deploy/postgres/pg_hba.conf` occupies in dev and e2e, and the
# same path `-c hba_file=` names in all three profiles. Compose keys volume
# merging on the container path, so the overlay's mount *replaces* the base
# file's rather than joining it; the image, the flag and every other record are
# untouched.
#
# ## What differs from `pg_hba.conf`, and it is one word per record
#
# Every non-loopback record here is **`hostssl`** rather than `host`. Nothing
# else changes: same records, same order, same databases, same users, same
# `scram-sha-256`. `server/tests/test_deploy_ops_posture.py` holds the two
# files to exactly that relationship, in both directions, so a record added to
# one and forgotten in the other fails the build rather than producing a prod
# database that authenticates differently from the one every test runs against.
#
# ## Why this file exists instead of an edit to the other one
#
# `compose.prod.yaml` starts Postgres with `ssl=on`, a server certificate and a
# key, and both api URLs carry `sslmode=verify-full`. What `ssl=on` does is
# *permit* TLS. It refuses nothing: a client that omits `sslmode` — the api if
# the query parameter were ever dropped from its URL, `psql` from a shell in
# any container on the compose network, the backup job's replication
# connection before Story 8.4 gave it one — connects in the clear and Postgres
# accepts it. So the enforcement rested entirely on a string surviving in two
# environment variables, which `deferred-work.md` recorded twice (the Story 8.2
# review, and again in the Story 8.3 review once this repository actually owned
# a `pg_hba.conf` to change) and both times named this profile's completion as
# the owner.
#
# `hostssl` is the server-side half: a connection that did not negotiate TLS
# does not match any of these records and is refused with
#
#     FATAL: no pg_hba.conf entry for host "…", user "…", no encryption
#
# — which is a loud, immediate, greppable failure at the connection rather than
# a silent downgrade nobody looks for.
#
# **This could not be one file.** Turning the two network records in
# `pg_hba.conf` into `hostssl` would enforce TLS in prod and, in the same edit,
# refuse every connection in dev and e2e, which have no certificates at all and
# never will — `docker compose up` on every laptop and the whole AD-15 e2e gate,
# broken by a change to a file whose comment says it is about production. Story
# 8.3 shipped `host` records for exactly that reason and said so in its own
# header. Two files mounted at one path is the mechanism this deployment
# already uses for the identical problem: `nginx/tls.conf` is mounted over the
# baked `nginx/default.conf` in prod and nowhere else.
#
# ## What is deliberately NOT here
#
# **No `ssl_ca_file` and no `clientcert=verify-full`.** Requiring client
# certificates would authenticate the *connecting container* as well as
# encrypting the link, which is strictly stronger — and it means issuing,
# distributing and rotating a certificate per service, on a deployment whose
# secret handling is a directory of files an operator mounts. That is a
# decision about how this deployment manages a PKI, not a line in this file,
# and it belongs with the Deferred identity-provider work that owns the same
# question for humans. `deploy/DEPLOYMENT.md § 8` records it with its trigger.
#
# ## The records
#
# The first six are `initdb`'s own, restated verbatim from `pg_hba.conf` and
# **unchanged**: the container's unix socket and loopback, for both `all` and
# `replication`. They must stay `host`/`local` and they must stay `trust`. The
# image's entrypoint bootstraps the database over them, runs
# `/docker-entrypoint-initdb.d` over them, and answers the `pg_isready` in
# every compose healthcheck over them — before `ssl=on` has any meaning and, on
# a first boot, before the server certificate has been read. `hostssl` on the
# loopback rows would leave the container unable to initialise itself and the
# healthcheck permanently failing, which is a prod stack that never reports
# ready for a reason no log line explains.
#
# The last two are the network, and they are the whole point of this file:
# every connection that crosses the compose bridge — the api's two pools, the
# copilot's psycopg pool, `alembic upgrade head` at boot, the daily audit
# redaction sweep, and the backup container's `pg_basebackup`,
# `pg_receivewal` and `pg_dump` — must be encrypted or refused.
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust
hostssl all             all             all                     scram-sha-256
hostssl replication     all             all                     scram-sha-256
