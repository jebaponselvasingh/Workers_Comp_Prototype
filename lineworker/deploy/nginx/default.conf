# nginx is the sole ingress: SPA static files + /api proxy.
# The /api prefix is stripped here; FastAPI carries root_path=/api.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers: nginx listens on 80 inside the container but
    # is published on 8080/8081, so an absolute redirect would rebuild the URL
    # without the published port and send clients somewhere that isn't us.
    absolute_redirect off;

    # Bare /api would otherwise fall through to the SPA and answer 200 with
    # index.html; send it to the proxied root instead.
    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # Variable upstream + Docker's embedded DNS so the api name is
        # re-resolved at request time — a recreated api container (new IP)
        # keeps working without restarting nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE-safe from day one (Epic 6 stream needs no ingress change):
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
