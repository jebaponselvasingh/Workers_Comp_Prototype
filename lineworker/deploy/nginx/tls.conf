# The prod twin of default.conf: same ingress, terminating TLS (NFR-5).
#
# `deploy/compose.prod.yaml` bind-mounts this file over
# /etc/nginx/conf.d/default.conf, replacing the copy `web/Dockerfile` bakes
# into the image. The image is unchanged and profile-independent; which server
# block it serves is a deployment fact.
#
# **The two files must be edited together.** Everything below the TLS
# directives — the bare-/api redirect, the /api/ proxy with its resolver and
# its SSE settings, the SPA try_files — is default.conf's, copied verbatim
# rather than included, because an `include` would put a fragment in the image
# that only one profile ever uses and split one server block across two files.
# `server/tests/test_deploy_tls_posture.py` reads both and fails if the SSE
# settings or the /api rewrite have drifted apart, which is what keeps a copy
# honest.
#
# Certificate and key arrive by bind mount from the host secret store
# (${TLS_CERT_DIR}, required by the prod overlay's `:?` guard). Nothing
# cryptographic is in version control, here or anywhere.

# Plain HTTP exists only to send clients to HTTPS. 308 rather than 301: the
# method and body must survive the redirect, and a POST /api/auth/login that
# silently became a GET would fail in a way nobody would attribute to a
# redirect.
server {
    listen 80;
    server_name _;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    # `http2 on;` is the 1.25.1+ spelling — the old `listen … http2` parameter
    # was deprecated in that release. The image is pinned to `nginx:stable-alpine`
    # (see web/Dockerfile), which is well past it; on anything older this
    # directive is an unknown one and nginx refuses to start rather than
    # quietly serving HTTP/1.1, which is the right failure but not an obvious
    # one to read.
    http2 on;
    server_name _;

    ssl_certificate /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    # **HSTS, because the 308 above is not a security control on its own.**
    # The redirect moves a client that already reached us in plaintext, which
    # means the first request of every session — the one carrying the URL a
    # handler typed or clicked — has already crossed the network unencrypted,
    # and an active attacker between the browser and this ingress strips the
    # redirect rather than following it. This header is what turns "we would
    # have preferred HTTPS" into "this browser will not speak plaintext to this
    # host again", for a year, on every subdomain.
    #
    # `always`, or nginx omits it from 4xx and 5xx responses — the ones a
    # session is most likely to start with. `preload` is deliberately absent:
    # it is a submission to a list baked into browser binaries and is
    # effectively irreversible, which is a deployment's decision to make and
    # not a default to inherit from a repository.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # 1.2 is the floor because 1.0/1.1 are deprecated and a claims console is
    # exactly the kind of thing an audit asks about; 1.3 is listed rather than
    # assumed so an older nginx does not quietly negotiate down.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    root /usr/share/nginx/html;
    index index.html;

    # Relative Location headers: nginx listens on 443 inside the container but
    # is published on whatever the host maps, so an absolute redirect would
    # rebuild the URL without the published port and send clients somewhere
    # that isn't us. Same reason as default.conf, one scheme over.
    absolute_redirect off;

    # Bare /api would otherwise fall through to the SPA and answer 200 with
    # index.html; send it to the proxied root instead.
    location = /api {
        return 308 /api/;
    }

    location /api/ {
        # Variable upstream + Docker's embedded DNS so the api name is
        # re-resolved at request time — a recreated api container (new IP)
        # keeps working without restarting nginx.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream api;
        rewrite ^/api/?(.*)$ /$1 break;
        proxy_pass http://$api_upstream:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # $scheme is `https` here and `http` in default.conf — the one line
        # whose *value* differs between the twins rather than its presence, and
        # the reason it is a variable in both.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # SSE-safe from day one (Epic 6 stream needs no ingress change):
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri /index.html;
    }
}
