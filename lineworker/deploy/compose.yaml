# LINEWORKER dev environment — one command from a clean checkout:
#   docker compose -f deploy/compose.yaml up
#
# nginx (web) is the ONLY published port. api and postgres live on the
# internal network. Interpolation defaults below are synthetic dev-only
# values; override via deploy/.env (git-ignored, see .env.example) —
# compose auto-loads .env from the project directory for ${…} interpolation.
# Ollama arrived with Story 6.1 (below, no ports: — AD-5); the backup job
# with Epic 8.
#
# **First boot downloads models.** The `ollama` service pulls CHAT_MODEL and
# EMBEDDING_MODEL before it reports healthy, and `api` waits for that — so
# the first `up` on a clean machine takes as long as several gigabytes over
# your connection. Subsequent boots are instant: the models live in the
# `ollama-models` volume. See deploy/.env.example.

name: lineworker

services:
  web:
    build:
      context: ..
      dockerfile: web/Dockerfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build:
      context: ../server
    # Every `Settings` field is settable from deploy/.env, not just the
    # handful named below. Compose auto-loads .env for `${…}` interpolation
    # but does *not* pass it into containers, and the image has no .env of
    # its own — so before this line, an operator following .env.example and
    # setting SESSION_TTL_HOURS, AUDIT_RETENTION_YEARS or
    # SLA_SETTLE_TARGET_DAYS got silence: the file was read, the value
    # interpolated nothing, and the app kept its default with nothing to
    # indicate why. (Not LOG_LEVEL — it is named in `environment:` below,
    # so it is one of the few that always worked, which makes it the one
    # example this comment must not use.)
    # required: false — .env is git-ignored and absent on a clean checkout,
    # which must stay a working `docker compose up`.
    env_file:
      - path: .env
        required: false
    environment:
      # Two-role model (Story 1.2): uvicorn connects as the app role (no
      # DDL); the entrypoint's alembic upgrade runs as the owner role and
      # creates lineworker_app with APP_DB_PASSWORD on first migrate.
      DATABASE_URL: postgresql://lineworker_app:${APP_DB_PASSWORD:-lineworker_app_dev}@postgres:5432/lineworker
      ALEMBIC_DATABASE_URL: postgresql://lineworker:${POSTGRES_PASSWORD:-lineworker_dev}@postgres:5432/lineworker
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-lineworker_app_dev}
      ENV: dev
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # AD-5: local-only inference, and the model names are deployment config
      # rather than literals in code. The URL is a compose service name — the
      # api reaches ollama on the internal network, and there is no host port
      # to reach it by.
      OLLAMA_BASE_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:14b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
      # AD-5/AD-16 containment, and it is not a preference. `langchain-core`
      # hard-depends on `langsmith`, whose tracer activates from these variables
      # alone and exports the whole prompt body and the whole completion to
      # `api.smith.langchain.com` — a claim's clinical narrative leaving the
      # network with no code in this repository to grep for. `config.py` forces
      # them off at import; they are repeated here so the container is closed
      # even before Python starts, and because `environment:` outranks the
      # `env_file:` above, where an inherited value would otherwise land.
      # All six names `config.py::_TRACING_ENV_OFF` forces, not a subset:
      # `langsmith.utils.get_env_var` reads the `LANGSMITH_*` spelling first and
      # falls back to `LANGCHAIN_*`, and `*_OTEL_ENABLED` is a second exporter —
      # so three of them left the door the comment above claims is closed only
      # half shut (follow-up review of Story 6.2, C5). The import-time overwrite
      # covers them either way; this is the layer that does not depend on any
      # Python having run.
      LANGSMITH_TRACING: "false"
      LANGSMITH_TRACING_V2: "false"
      LANGCHAIN_TRACING: "false"
      LANGCHAIN_TRACING_V2: "false"
      LANGSMITH_OTEL_ENABLED: "false"
      LANGCHAIN_OTEL_ENABLED: "false"
    volumes:
      # The blob volume, read-write here and read-only in `backup` (Story 8.3).
      #
      # `services/blobstore.VolumeBlobStore` has existed since Story 2.5 with no
      # setting, no volume and no bytes — `document.blob_key` and
      # `photo.blob_key` are NULL on all 856 seeded rows — and the
      # MinIO-versus-mounted-volume decision is still Deferred. This mount does
      # not decide it. What it does is give the store that exists today a
      # canonical location, which two things need: `scripts/purge_claim.py
      # --blob-root` (Story 8.1) refuses a path that is not an existing
      # directory, and the backup job has to tar *something* from the day it
      # ships. A backup that covered only the stores that had bytes in them on
      # the day it was written would silently stop being complete the first time
      # a real PDF landed, which is the failure this story exists to close.
      - blobdata:/var/lib/lineworker/blobs
    depends_on:
      postgres:
        condition: service_healthy
      # `service_healthy`, and ollama's healthcheck is "the models are pulled"
      # rather than "the server answered" — so the api never starts against a
      # model server that is up but has nothing loaded. That distinction is the
      # whole reason the entrypoint below writes a readiness file.
      ollama:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  ollama:
    image: ollama/ollama:latest
    # **No ports: mapping, in this profile or any other (AD-5).** The model
    # server is reachable from `api` on the internal network and from nowhere
    # else — the same posture postgres has held since Story 1.1, and for a
    # stronger reason: an exposed Ollama is an unauthenticated inference
    # endpoint that will happily accept a prompt containing PHI. CI renders this
    # file and fails if a `ports:` key appears under this service.
    #
    # `:latest` here and a digest at deploy: the architecture pins "current
    # stable server, image digest pinned at deploy", and a digest committed to a
    # dev compose file goes stale in a way nobody notices until a pull fails.
    environment:
      # Read by the entrypoint below, not by the server. Interpolated from the
      # same .env keys the api container gets, so "which models does this
      # deployment run?" has one answer in one file.
      CHAT_MODEL: ${CHAT_MODEL:-qwen3:14b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-bge-m3}
    volumes:
      - ollama-models:/root/.ollama
    # Serve first, then pull, then mark ready. The order matters: `ollama pull`
    # talks to the local server over HTTP, so it cannot run before `serve` is
    # listening — and `serve` must stay in the foreground as PID 1's child or
    # the container exits the moment the pull finishes.
    #
    # The readiness file is written only after **both** pulls succeed, which is
    # what makes the healthcheck below mean "ready to embed" rather than "a
    # process is listening". Without it, `api` starts, the first refresh tick
    # asks for an embedding, and Ollama answers 404 for a model it has not
    # finished downloading — a failure that looks like a bug in services/rag.
    # `set -e` is load-bearing, not hygiene. Without it the pulls below are
    # three independent statements: a pull that fails — a typo'd tag, a full
    # disk, no route to the registry — leaves the shell running, `touch`
    # writes the readiness file anyway, the healthcheck passes, and `api`
    # starts against a server holding no models. That is precisely the failure
    # the comment above says this file exists to prevent, arriving as a 404
    # from a model name nobody typed wrong.
    #
    # The wait for `serve` is bounded for the same class of reason. An
    # unbounded `until` loop against a server that died before it listened
    # spins for ever: the container neither exits nor reports unhealthy, and
    # with a 30-minute `start_period` `docker compose up` blocks for half an
    # hour before anything says why. Sixty tries at one second is far longer
    # than a local server needs to bind a port and far shorter than a pull.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        rm -f /tmp/ollama-ready
        ollama serve &
        server=$$!
        waited=0
        until ollama list >/dev/null 2>&1; do
          waited=$$((waited + 1))
          if [ $$waited -gt 60 ]; then
            echo "ollama serve did not accept connections within 60s" >&2
            exit 1
          fi
          sleep 1
        done
        ollama pull "$$CHAT_MODEL"
        ollama pull "$$EMBEDDING_MODEL"
        touch /tmp/ollama-ready
        wait $$server
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ollama-ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Long, and it is the pull that needs it: several gigabytes on a first
      # boot. `start_period` failures do not count against `retries`, so a slow
      # connection delays the stack rather than failing it — and once the volume
      # is populated, the check passes on the first interval.
      start_period: 30m

  postgres:
    build:
      context: ./postgres
    image: lineworker/postgres:pg18-pgaudit
    # No ports: mapping — the DB is reachable only on the internal network.
    #
    # ## The hardening flag list (Story 8.2, AD-11)
    #
    # **pgaudit captures `ddl, role` and nothing else, and every DML-logging
    # knob is pinned off explicitly.** AD-4 gives value-level history to
    # `audit_event`, whose before/after diffs the Story 8.1 purge cascade can
    # redact in place. A line in Postgres's own log file cannot be redacted by
    # anything this system owns — so a posture that logged statements or bound
    # parameters would create a second, permanent copy of exactly the data the
    # cascade exists to remove. `log_statement`, `log_duration`,
    # `log_min_duration_statement`, `log_min_error_statement` and the two
    # parameter-length caps are all already at these values by default; they
    # are stated anyway so that turning one of them into a PHI surface is a
    # visible diff rather than a default nobody wrote down.
    #
    # **`-c` flags rather than a mounted `postgresql.conf` or a baked
    # `postgresql.conf.sample`.** A sample file applies at `initdb` only, so the
    # `pgdata` volume below — created long before this image existed — would
    # keep the stock posture for ever and the drift would be invisible.
    # `config_file=` would mean shipping a complete configuration and owning
    # every default in it. Flags apply on every start regardless of when the
    # volume was created, and a weakened one is a reviewable one-line diff.
    #
    # **The list is byte-identical in `compose.e2e.yaml` and repeated with the
    # TLS additions in `compose.prod.yaml`**, because the story's rule is that
    # dev, e2e and prod get the same posture by the same mechanism so drift
    # cannot hide. Restating it in three files is a real cost; it is paid by
    # `server/tests/test_deploy_tls_posture.py`, which fails when they
    # disagree, rather than by a comment asking people to remember.
    #
    # **Seven days of log, and the bound is a time bound.**
    # `log_filename=postgresql-%a.log` + `log_truncate_on_rotation=on` +
    # `log_rotation_age=1d` + `log_rotation_size=0` is Postgres's own recipe for
    # "keep a week and no more": seven files, one per weekday, each truncated
    # when its day comes round. A byte cap instead would rotate *within* a day
    # back onto the same `%a` name and silently destroy that morning's lines,
    # which is a worse property for an audit-adjacent log than a size bound is
    # worth. What makes a time bound sufficient is the posture itself — with
    # every DML class off, a day's log is connection lines and schema changes,
    # not traffic.
    #
    # **`logging_collector=on` deliberately takes these logs off container
    # stdout.** That is the point: `log_directory=log` is relative, so it
    # resolves inside PGDATA and therefore inside the volume the deployment
    # view encrypts at rest. `docker compose logs postgres` gets quieter and
    # the DDL record stops flowing into whatever collects container output.
    # `docker compose exec postgres cat /var/lib/postgresql/18/docker/log/
    # postgresql-$(date +%a).log` is how you read it.
    #
    # ## Two more flags, added by Story 8.3
    #
    # **`max_slot_wal_keep_size=2GB`** is the bound that stops an abandoned
    # replication slot from filling the data volume. The backup container holds
    # a physical slot so `pg_receivewal` can stream a replayable archive; a slot
    # with nobody consuming it — the backup container stopped, the host it
    # copies to unreachable for a week — pins every WAL segment since the
    # consumer's last position, for ever, by design. Without this bound the WAL
    # receiver's failure mode is a `pgdata` volume that fills and a database that
    # stops accepting writes, which is a far worse outage than the missed backup
    # it would have been protecting. With it, Postgres invalidates the slot,
    # `pg_receivewal` fails loudly, `status.json` records the gap and the
    # database keeps serving. 2 GB is roughly a day of this system's write
    # volume and is a knob only in the sense that a deployment writing much more
    # should raise it; it is not in `.env.example` because the number is a
    # property of the database's disk, not of the backup schedule.
    #
    # **`hba_file=/etc/postgresql/pg_hba.conf`** points client authentication at
    # the committed file mounted below, which adds exactly one record to the
    # image's default: a physical replication connection over the internal
    # network. The official image appends `host all all all scram-sha-256`, and
    # `all` in the database column does not match a replication connection — so
    # without this, `pg_basebackup` and `pg_receivewal` from the backup
    # container fail with "no pg_hba.conf entry for replication connection". No
    # role and no grant changes; `deploy/postgres/pg_hba.conf` argues the whole
    # thing at length, including why an `initdb` hook would not have worked on
    # the pre-existing `pgdata` volume.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - pgaudit.log=ddl,role
      - -c
      - pgaudit.log_catalog=off
      - -c
      - pgaudit.log_parameter=off
      - -c
      - pgaudit.log_relation=off
      - -c
      - pgaudit.log_statement_once=on
      - -c
      - log_statement=none
      - -c
      - log_duration=off
      - -c
      - log_min_duration_statement=-1
      - -c
      - log_min_error_statement=panic
      - -c
      - log_parameter_max_length=0
      - -c
      - log_parameter_max_length_on_error=0
      - -c
      - logging_collector=on
      - -c
      - log_destination=stderr
      - -c
      - log_directory=log
      - -c
      - log_filename=postgresql-%a.log
      - -c
      - log_rotation_age=1d
      - -c
      - log_rotation_size=0
      - -c
      - log_truncate_on_rotation=on
      - -c
      - max_slot_wal_keep_size=2GB
      - -c
      - hba_file=/etc/postgresql/pg_hba.conf
    environment:
      POSTGRES_USER: lineworker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lineworker_dev}
      POSTGRES_DB: lineworker
    volumes:
      - pgdata:/var/lib/postgresql
      # Client authentication, pointed at by `-c hba_file=` above. Mounted
      # rather than baked or appended for the reason that file argues at
      # length: an `initdb` hook applies only when the data directory is
      # created, so the record permitting the backup container's replication
      # connection would never appear on a `pgdata` volume that already exists,
      # and the drift would be invisible (Story 8.3).
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lineworker -d lineworker"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backup:
    # A base backup of a real database takes minutes, and compose's default
    # stop timeout is ten seconds — so `down` during the nightly window used to
    # SIGKILL the run, which skips every trap and leaves the plaintext staging
    # directory behind (both `entrypoint.sh` and `backup.sh` now sweep it, but
    # not having written it is better). Five minutes lets a run reach its own
    # signal handler, write `status.json` as a failure, and remove its plaintext
    # before the kernel takes over.
    stop_grace_period: 300s
    build:
      context: ./backup
    image: lineworker/backup:pg18
    # ## The `bak` container the deployment view has named since Story 1.1
    #
    # One container owning the whole pipeline: `pg_basebackup` + `pg_dump` + a
    # tar of the blob volume, each `age`-encrypted **before** anything is copied
    # off-host, plus a continuously-streaming `pg_receivewal` so the archive is
    # replayable rather than decorative. `deploy/backup/backup.sh` argues the
    # ordering; `deploy/RESTORE-DRILL.md` is the runbook and records the drill
    # that was actually executed against it.
    #
    # ### `profiles: ["backup"]`, and it is Story 1.1's promise
    #
    # "`docker compose -f deploy/compose.yaml up` on a clean checkout just
    # works" is a standing commitment, and a clean checkout has no `.env`,
    # therefore no `BACKUP_AGE_RECIPIENT` — so an always-on backup service would
    # start, refuse its configuration, and leave every `up` on every laptop with
    # a container in a failed state. Profile-gated, it does not start unless
    # somebody asks for it:
    #
    #     docker compose --profile backup -f deploy/compose.yaml up -d
    #     docker compose -f deploy/compose.yaml run --rm backup once
    #
    # (`run` starts a one-off container for a service regardless of its
    # profiles, which is why the one-shot form needs no flag.) The **prod**
    # overlay clears the gate with `profiles: !override []`, so on a real
    # deployment the service is always on and no operator has to remember a
    # flag — verified against `docker compose config`, not assumed.
    #
    # ### No `ports:`, in this profile or any other
    #
    # The same rule `postgres` and `ollama` keep. This container holds a
    # connection that can read the entire claim book and a directory of
    # encrypted copies of it; there is nothing it could usefully publish and a
    # great deal it must not. CI asserts the absence in every rendered profile.
    #
    # ### AD-3: one stream covers the whole instance
    #
    # `pg_dump -Fc` of database `lineworker` carries the relational entities,
    # `claim_embedding` and the `knowledge_*` vectors, the vendored LangGraph
    # checkpoint tables, `ai_insight` and `audit_event` in one artifact. That is
    # the load-bearing rationale of the single-database decision, and it is why
    # there is exactly one backup service here rather than one per store. The
    # blob volume is the only PHI-class store outside Postgres, so it is the
    # only thing tarred separately — mounted **read-only** here, read-write on
    # `api`, because this job reads and never writes (AD-12).
    #
    # ### AD-11: encrypted before it leaves the host
    #
    # `age -r $BACKUP_AGE_RECIPIENT` runs before `rsync`, always, and the
    # identity that could decrypt any of it is not on this host, not in this
    # image and not in version control. Compromising the backup host — the exact
    # scenario an off-host backup exists to survive — therefore yields no
    # ability to read a single backup, past or future.
    profiles: ["backup"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The owner role, which already holds REPLICATION in this deployment (it
      # is the bootstrap superuser the image creates), and which this job uses
      # read-only. No new role, no new grant: AD-4's posture is untouched, and
      # the story's data note says so in as many words. The default composes the
      # same credentials `api`'s ALEMBIC_DATABASE_URL uses, so a deployment that
      # changed POSTGRES_PASSWORD does not have to remember to change this too.
      BACKUP_DATABASE_URL: ${BACKUP_DATABASE_URL:-postgresql://lineworker:${POSTGRES_PASSWORD:-lineworker_dev}@postgres:5432/lineworker}
      # **Deliberately empty by default.** There is no safe default for a
      # recipient: any value shipped here would be a public key somebody else
      # holds the identity for. Empty means `backup.sh` refuses at its config
      # stage, *before* `pg_dump` runs, so an unconfigured deployment produces
      # no plaintext artifact rather than one it then fails to encrypt. The prod
      # overlay upgrades this to a `${…:?}` guard that fails the render.
      BACKUP_AGE_RECIPIENT: ${BACKUP_AGE_RECIPIENT:-}
      # A directory inside the backup volume by default, which is an off-host
      # destination in shape and not in fact — enough to exercise the whole
      # pipeline on a laptop, and named in `.env.example` as the one thing a
      # real deployment must change. The SSH form is `user@host:/path`.
      BACKUP_REMOTE: ${BACKUP_REMOTE:-/var/lib/lineworker/backup/offhost}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_KEEP_RUNS: ${BACKUP_KEEP_RUNS:-7}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
      # On in dev, on in prod, off in e2e — and the difference is confined to
      # what must differ. The e2e profile drives one-shot runs from a spec and
      # never leaves a container up, so a replication slot there would be an
      # abandoned slot by construction.
      BACKUP_WAL: ${BACKUP_WAL:-on}
      # Fixed container path; the host path is the knob, and only the prod
      # overlay mounts anything onto it. `backup.sh` tests the file's *size*, so
      # the absence of a key is the absence of bytes rather than a second
      # variable to keep in step.
      BACKUP_SSH_KEY: /etc/lineworker/backup-ssh/id_backup
    volumes:
      - backupdata:/var/lib/lineworker/backup
      # Read-only, and that is the AD-12 write-owner note as a mount option: the
      # backup job reads the whole instance and the blob volume and writes
      # nothing to either.
      - blobdata:/var/lib/lineworker/blobs:ro
    # AC 3's entire binding surface. There is no monitoring integration and no
    # alerting — both deferred by decision — so "a failed nightly run surfaces
    # non-silently" means this container goes `unhealthy` in `docker compose ps`
    # beside every other service, for a run that failed *and* for a scheduler
    # that quietly stopped. `deploy/backup/healthcheck.sh` carries the rule.
    #
    # `interval: 60s` because the thing being measured moves once a day; a
    # ten-second poll would be twenty thousand reads of a file that changes
    # once. `start_period` is short for the same reason the window is measured
    # from container start: a fresh container with no run yet is healthy by
    # design, so there is nothing to wait for.
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  pgdata:
  # Pulled models. Named rather than anonymous so `docker compose down` keeps
  # them and only `down -v` re-downloads.
  ollama-models:
  # The backup job's state and artifacts: `artifacts/<runId>/`, the WAL spool,
  # `status.json` and the container-start marker. Named, so `docker compose
  # down` keeps the backups and only `down -v` destroys them — which is exactly
  # the distinction the restore drill rests on.
  backupdata:
  # The `BlobStore` volume (Story 8.3, Design Note 5). Empty today and mounted
  # anyway: read-write on `api` at the path `scripts/purge_claim.py --blob-root`
  # wants, read-only on `backup`, and tarred into the artifact set from birth.
  # Declaring it does not settle the deferred MinIO-versus-volume decision; it
  # gives the implementation that already exists a location.
  blobdata:
