# LINEWORKER CI gate (Story 1.1, completed by Story 8.4 — AD-15).
#
# Provider choice: GitHub Actions — the repo is GitHub-hosted; the CI provider
# is a conventional default, not architecture-pinned (see Story 1.1 Project
# Structure Notes).
#
# ## Five jobs, and all five must be required checks for merge to `main`
#
# Branch protection lives in GitHub repository settings and cannot be created,
# read or applied from this working tree. `.github/required-checks.yml` is the
# reviewable record of what that configuration must say, and
# `server/tests/test_required_checks.py` holds it and this file's `jobs:` list in
# **set equality, both ways** — so a sixth job added here and not declared there
# fails the build, and a declared check naming no job fails it too. What stays
# manual is typing the names into the settings page; what stopped being manual
# is knowing what the list should contain.
#
# ## Two stages, which is now this file's organising idea
#
# * **Pull request** — every job below runs, with `e2e` narrowed to the PR's
#   declared story spec(s) plus the `@smoke` set (AD-15). The narrowing is
#   derived from the branch name and the PR labels and can only ever *narrow*:
#   a PR from which no story key is derivable runs the full suite instead, and
#   a derive step that produced neither answer now fails the job rather than
#   skipping both run steps and reporting green.
# * **Merge to `main`** — every job below runs, with `e2e` running the **full**
#   suite. That is the permanent regression floor the roadmap's hardening phase
#   installs: after Story 8.4 every future change ships against every spec, and
#   specs are amended, never deleted.
#
# The sprint-status ↔ `e2e/stories` bijection lint that this header used to
# defer to "a later story" landed with Story 8.4 and runs in the `server` job.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only, and stated rather than inherited. An unstated `permissions:` block
# takes the repository's default, which is a privilege nobody argued for in an
# epic about hardening — and the default is settable elsewhere, so this file
# would not record what these jobs can do. Nothing here writes: no job pushes a
# commit, opens an issue, publishes a package or comments on a PR. The one thing
# that leaves a runner is `actions/upload-artifact`, which uses its own scoped
# token rather than this one.
permissions:
  contents: read

defaults:
  run:
    working-directory: lineworker

jobs:
  server:
    name: server lint+typecheck+pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: lineworker/server
      # `../deploy` is in scope since the review of Story 6.5. It holds one
      # Python file — `deploy/model-stub/app.py`, the deterministic model the
      # e2e stack runs against — and that file had grown the branch that makes
      # the copilot's write path testable end to end while sitting outside
      # every lint, format and typecheck scope in the repo. Ruff resolves
      # settings from this directory's `pyproject.toml` for paths given on the
      # command line, so the stub is held to the same line length and rule set
      # as `server/` without a second config to keep in step. `mypy` is
      # deliberately not widened: the stub is untyped by design (it answers
      # arbitrary JSON schemas), and annotating it is a change to what it is
      # rather than a check on what it does.
      - run: uv run ruff check . ../deploy && uv run ruff format --check . ../deploy
        working-directory: lineworker/server
      - run: uv run mypy .
        working-directory: lineworker/server
      # AD-11's app-log PHI ban, as a build step (Story 8.2). Beside ruff and
      # mypy rather than inside pytest because it is the same *kind* of thing —
      # a whole-tree static check whose failure names a file and a line — and
      # because a developer who has just written `log.info("x", body=…)` should
      # meet it in the lint step where they are already looking. It also runs
      # in `pytest` via tests/test_log_phi_lint.py, which is what keeps the
      # migrations job covering it too.
      - name: log PHI lint
        run: uv run python -m scripts.lint_log_phi
        working-directory: lineworker/server
      # AD-15's sprint-status ↔ e2e/stories bijection (Story 8.4). Beside the
      # PHI lint for the same reason it is beside ruff: a whole-tree static
      # check whose failure names a file and a key.
      #
      # **In this job rather than in `e2e`, deliberately.** The thing it catches
      # is a story whose spec was never written or was renamed — and `e2e`'s own
      # derive step is blind to exactly that: it only counts a story key whose
      # spec file exists, so a missing spec contributes no grep term, the smoke
      # set runs, and the job goes green having tested nothing about the story
      # the PR is for. The lint has to run somewhere that does not depend on the
      # file it is looking for. It is also cheap and deterministic, and it wants
      # to fail on the PR that renames a story rather than after the merge.
      #
      # It also runs in `pytest` via tests/test_story_spec_lint.py, which is what
      # keeps the migrations job covering it too.
      - name: story spec bijection lint
        run: uv run python -m scripts.lint_story_specs
        working-directory: lineworker/server
      - run: uv run pytest
        working-directory: lineworker/server

  web:
    name: web lint+typecheck+vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lineworker/web/package-lock.json
      # The generated API client is committed, so it can go stale against a
      # changed endpoint signature. Regenerating and diffing turns that into
      # a failed build instead of a runtime surprise (needs Python for the
      # server's OpenAPI dump).
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: lineworker/server
      - run: npm ci
        working-directory: lineworker/web
      - name: check the generated OpenAPI client is up to date
        working-directory: lineworker/web
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts \
            || { echo "::error::src/api/schema.d.ts is stale — run 'npm run generate:api' and commit it."; exit 1; }
      - run: npm run lint
        working-directory: lineworker/web
      - run: npm run typecheck
        working-directory: lineworker/web
      - run: npm test
        working-directory: lineworker/web

  migrations:
    name: alembic upgrade against fresh DB
    runs-on: ubuntu-latest
    # **No `services:` block, since Story 8.2.** A GitHub service container is
    # created before the first step runs and can therefore only pull an image
    # from a registry — it cannot use one the workflow builds. This job now
    # needs `deploy/postgres`'s image, because migration `0050_pgaudit` runs
    # `CREATE EXTENSION pgaudit` and raises against a server that has not
    # preloaded the library. That refusal is deliberate (a bare upgrade against
    # an unconfigured Postgres must fail loudly rather than skip), which means
    # the job proving "migrations run clean against a fresh database" has to
    # start a configured one.
    #
    # So the database is built and started as ordinary steps below. The flags
    # are `deploy/compose.yaml`'s hardening list, which is also what
    # `tests/test_pgaudit_posture.py` asserts — so those four tests run here
    # rather than skipping, and this job covers the whole AD-11 database
    # posture instead of only the schema.
    #
    # **Story 8.3 adds two flags and a mount.** `tests/test_backup_restore.py`
    # runs the shipped backup image against this database, and `pg_basebackup`
    # opens a *physical replication* connection — which the official image's
    # `host all all all` record does not match, because PostgreSQL treats
    # `replication` as a distinct pseudo-database. So the committed
    # `deploy/postgres/pg_hba.conf` is mounted and named by `-c hba_file=`,
    # exactly as every compose profile does it, and `max_slot_wal_keep_size`
    # joins the list because `test_backup_posture.py` asserts the profiles agree
    # about it. Without the mount that module fails with "no pg_hba.conf entry
    # for replication connection", which would be a database that is not the
    # deployment's rather than a bug in the test.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: lineworker/server
      - name: build and start the pgaudit test database
        run: |
          docker build -t lineworker/postgres:pg18-pgaudit deploy/postgres
          docker run -d --name lw-ci-pg \
            -e POSTGRES_USER=lineworker -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=lineworker \
            -p 5432:5432 \
            -v "$PWD/deploy/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro" \
            lineworker/postgres:pg18-pgaudit postgres \
            -c shared_preload_libraries=pgaudit \
            -c pgaudit.log=ddl,role \
            -c pgaudit.log_catalog=off \
            -c pgaudit.log_parameter=off \
            -c pgaudit.log_relation=off \
            -c pgaudit.log_statement_once=on \
            -c log_statement=none \
            -c log_duration=off \
            -c log_min_duration_statement=-1 \
            -c log_min_error_statement=panic \
            -c log_parameter_max_length=0 \
            -c log_parameter_max_length_on_error=0 \
            -c logging_collector=on \
            -c log_destination=stderr \
            -c log_directory=log \
            -c log_filename=postgresql-%a.log \
            -c log_rotation_age=1d \
            -c log_rotation_size=0 \
            -c log_truncate_on_rotation=on \
            -c max_slot_wal_keep_size=2GB \
            -c hba_file=/etc/postgresql/pg_hba.conf
          # Bounded, for compose.yaml's `ollama` entrypoint reason: an
          # unbounded wait on a container that died before it listened spins
          # until the job's own timeout with nothing saying why. Sixty tries at
          # one second is far longer than Postgres needs to bind a port, and
          # the container's own logs are printed on the way out — a postmaster
          # that refused to load pgaudit says so there and nowhere else.
          #
          # **Probed from the runner over TCP, not with `docker exec`.** The
          # official image's entrypoint runs an initdb-time temporary server
          # for the init scripts, and that server listens on the container's
          # unix socket with TCP disabled — so `docker exec … pg_isready`
          # succeeds against a postmaster nothing outside the container can
          # reach, and the very next step is `alembic upgrade head` from the
          # runner over `localhost:5432`. The probe has to ask the question the
          # next step asks. `pg_isready` ships with the postgresql-client
          # package the ubuntu runner image already carries; it checks that the
          # port accepts a connection *and* that the server is answering, which
          # a bare TCP knock does not.
          ready=""
          for _ in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U lineworker -d lineworker >/dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::the pgaudit test database did not become ready within 60s"
            docker logs lw-ci-pg
            exit 1
          fi
          echo "postgres is ready"
      - run: uv run alembic upgrade head
        working-directory: lineworker/server
        env:
          DATABASE_URL: postgresql://lineworker:ci@localhost:5432/lineworker
      # The whole suite, against a real database.
      #
      # **This used to be a hand-enumerated list of the DB-backed files**, and
      # the trap it set was recorded by Story 2.1, tripped by Story 2.2 and
      # about to be tripped again by 2.3: every `pytestmark = requires_db`
      # module skips silently in the server job above, so a new one that
      # nobody remembered to add here simply never ran, and nothing failed to
      # say so. A green tick that covers less than it looks like is worse
      # than a red one.
      #
      # The fix is to stop maintaining the list. `MIGRATION_TEST_DATABASE_URL`
      # is what turns the skips into runs, so with it set, `pytest` *is* the
      # list — and it stays correct for every story after this one. The cost
      # is that the pure tests run twice across the two jobs (~30 seconds);
      # the alternative cost was coverage nobody could see was missing.
      - run: uv run pytest
        working-directory: lineworker/server
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://lineworker:ci@localhost:5432/lineworker
      - run: docker rm -f lw-ci-pg
        if: always()

  compose:
    name: compose config (AD-5 port posture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AD-5's hardest rule is a negative: the model server's port is never
      # published, in any profile. A negative is exactly what nobody notices
      # going missing — a `ports:` line added "just for debugging" reviews as a
      # one-line diff and turns an internal, unauthenticated inference endpoint
      # into a host-reachable one that will happily accept a prompt containing
      # PHI.
      #
      # Rendered with `docker compose config` rather than grepped out of the
      # YAML, because the overlay is the case that matters: a port added in
      # compose.gpu.yaml would not appear in compose.yaml's text at all, and the
      # merged document is the thing that actually runs.
      - name: render the four profiles
        # The prod overlay joined the list with Story 8.2. It cannot be booted
        # here — there are no certificates in version control — but it *can* be
        # rendered, and rendering it is what proves the `${TLS_CERT_DIR:?}`
        # guards, the `ports: !override` on web and the restated postgres
        # `command:` all merge into a document that would start. The two
        # directories are dummy paths: `config` interpolates them and never
        # looks for them.
        #
        # **`--profile backup` on the dev, gpu and e2e renders (Story 8.3).**
        # Those three gate the backup service behind a profile so that a clean
        # checkout still runs `docker compose up` with nothing configured — which
        # means that without the flag the service is absent from the rendered
        # document and every assertion below about it passes vacuously. The prod
        # render deliberately does **not** carry the flag: that profile clears
        # the gate with `profiles: !override []`, and the whole point of the
        # assertion further down is that the service is there without one.
        #
        # The two backup variables are dummies for the same reason the two TLS
        # directories are: `config` interpolates them and never looks at them.
        env:
          TLS_CERT_DIR: /tmp/tls
          PG_TLS_DIR: /tmp/tls
          BACKUP_AGE_RECIPIENT: age1ci0000000000000000000000000000000000000000000000000000000
          BACKUP_REMOTE: /tmp/offhost
          # Story 8.4 put `${...:?}` guards on the two database credentials, so
          # the prod render now refuses to produce a document without them —
          # which is the point, and which means this step has to supply dummies
          # exactly as it already does for the TLS directories. They are never
          # dereferenced: `config` interpolates and does not connect.
          POSTGRES_PASSWORD: ci-not-a-real-password
          APP_DB_PASSWORD: ci-not-a-real-password-either
        run: |
          docker compose --profile backup -f deploy/compose.yaml config \
            --format json > /tmp/dev.json
          docker compose --profile backup -f deploy/compose.yaml -f deploy/compose.gpu.yaml \
            config --format json > /tmp/gpu.json
          docker compose --profile backup -f deploy/compose.e2e.yaml config \
            --format json > /tmp/e2e.json
          docker compose -f deploy/compose.yaml -f deploy/compose.gpu.yaml \
            -f deploy/compose.prod.yaml config --format json > /tmp/prod.json
      # The clean-checkout promise, asserted rather than trusted (Story 1.1,
      # restated by Story 8.3). Rendering the dev profile with **no** variables
      # and **no** profile flag must succeed and must not contain the backup
      # service: if it did, `docker compose up` on a laptop with no `.env` would
      # start a container that refuses its own configuration and sits in a failed
      # state, which is the one thing the profile gate exists to prevent.
      - name: a clean checkout renders without the backup service
        run: |
          docker compose -f deploy/compose.yaml config --format json > /tmp/clean.json
          python3 -c '
          import json, sys
          services = json.load(open("/tmp/clean.json"))["services"]
          if "backup" in services:
              print("::error::the backup service is present in a bare `docker compose -f "
                    "deploy/compose.yaml config`. It must stay behind `profiles: [\"backup\"]` "
                    "so a clean checkout with no .env still comes up.")
              sys.exit(1)
          print("ok: clean render has", len(services), "services and no backup")
          '
      # The e2e profile is asserted from the other direction: it must run the
      # deterministic stub and must NOT declare a real model server, or specs
      # would wait on inference and a CI runner would download gigabytes.
      #
      # The prod document is passed to the same check for AD-5's sake: a prod
      # overlay is exactly where somebody eventually publishes the model port
      # "just for the GPU host", and it is the one profile no test in the server
      # suite can boot to notice.
      - name: no published port on the model server
        run: |
          python3 ../.github/scripts/check_model_ports.py \
            /tmp/dev.json /tmp/gpu.json /tmp/e2e.json /tmp/prod.json
      # `ports: !override` on web, asserted against the *rendered* document
      # rather than against the file's text (Story 8.2).
      #
      # Compose appends port lists across files, so without the tag the merged
      # prod stack publishes 8080:80 beside 443 — plain HTTP on the dev port, a
      # healthy `docker compose ps`, and no error anywhere. `server/tests/
      # test_deploy_tls_posture.py` asserts the string `ports: !override` is
      # present, which catches deletion and not a misspelling: `!overide` is a
      # YAML tag compose ignores, and every text assertion in the suite would
      # still pass. The rendered document is the only place the difference
      # shows, and this job is the only thing that renders it.
      - name: the prod ingress publishes 443 and 80 and nothing else
        run: |
          python3 -c '
          import json, sys
          web = json.load(open("/tmp/prod.json"))["services"]["web"]
          published = sorted(str(p.get("published")) for p in web.get("ports", []))
          if published != ["443", "80"]:
              print(f"::error::the rendered prod profile publishes {published} on web, "
                    "expected 443 and 80 only — `ports: !override` has been dropped or "
                    "misspelled and compose has appended the dev mapping.")
              sys.exit(1)
          print("ok: prod web publishes 443 and 80 only")
          '
      # Story 8.3, and the same class of check for the same reason: a YAML tag
      # compose does not recognise is *ignored*, not rejected. `profiles:
      # !overide []` — one letter — leaves the inherited `["backup"]` in place,
      # `server/tests/test_backup_posture.py`'s string assertion still passes,
      # and a prod stack silently stops taking backups until somebody remembers
      # `--profile backup`. The rendered document is the only place the
      # difference shows and this job is the only thing that renders it.
      #
      # The port assertion is here rather than in `check_model_ports.py` because
      # that script is about the model server. This container holds a connection
      # that can read the whole claim book and a directory of encrypted copies of
      # it; a published port on it is a worse mistake than a published Ollama.
      - name: the backup service is enabled in prod and publishes nothing anywhere
        run: |
          python3 -c '
          import json, sys
          failures = []
          prod = json.load(open("/tmp/prod.json"))["services"]
          if "backup" not in prod:
              failures.append("the rendered prod profile has no backup service — "
                              "`profiles: !override []` has been dropped or misspelled, "
                              "so backups run only when somebody remembers --profile backup")
          for name in ("dev", "gpu", "e2e", "prod"):
              services = json.load(open(f"/tmp/{name}.json"))["services"]
              backup = services.get("backup")
              if backup is None:
                  failures.append(f"{name}: no backup service in the rendered document")
                  continue
              if backup.get("ports"):
                  failures.append(f"{name}: backup publishes " + str(backup["ports"]))
          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          '

      # --- Story 8.4: the prod profile, finished ---------------------------
      #
      # Three properties the story added, all of them invisible in the file text
      # for the same reason the two assertions above are: they are consequences
      # of a *merge*, and the merged document is what runs.
      - name: the prod profile restarts, pins its pg_hba, and publishes nothing else
        run: |
          python3 -c '
          import json, sys
          failures = []
          prod = json.load(open("/tmp/prod.json"))["services"]
          if not prod:
              failures.append("the rendered prod document has no services at all — "
                              "this check would otherwise pass by iterating nothing")
          for name, service in sorted(prod.items()):
              # A production stack with no restart policy does not survive a host
              # reboot: every container stays down until somebody notices, which
              # for the backup job means a silently missed night.
              #
              # Bound to locals rather than inlined into the f-strings: this whole
              # block is a single-quoted shell argument, so a double quote inside
              # a nested subscript has to be backslash-escaped, and the escape is
              # a literal backslash by the time python parses it. That is a
              # SyntaxError the step reports as a crashing check rather than as a
              # failing one, which is the worst kind of green.
              restart = service.get("restart")
              ports = service.get("ports")
              if restart != "unless-stopped":
                  failures.append(f"{name}: restart is {restart!r}, expected "
                                  "unless-stopped in the prod profile")
              # AD-5, from the other side of check_model_ports.py: web is the sole
              # ingress, so nothing else may publish anything.
              if name != "web" and ports:
                  failures.append(f"{name}: publishes {ports} in prod; web is "
                                  "the only service with an ingress")
          postgres = prod.get("postgres", {})
          mounts = [v.get("source", "") for v in postgres.get("volumes", [])]
          if not any(m.endswith("pg_hba.prod.conf") for m in mounts):
              failures.append("the prod postgres does not mount pg_hba.prod.conf — without "
                              "it the network records stay `host` and a client that omits "
                              "TLS is still accepted on the link 8.2 encrypted")
          # …and the additive half is not enough. The two mounts collapse into one
          # only because they share a container path, so compose keys them the same
          # and the later file wins. Change either target and BOTH mount, with the
          # effective client-auth policy decided by mount order rather than by the
          # overlay — which reads as correct in every text assertion in the suite.
          if any(m.endswith("postgres/pg_hba.conf") for m in mounts):
              failures.append("the rendered prod profile mounts BOTH pg_hba.conf and "
                              "pg_hba.prod.conf. They are supposed to collide on one "
                              "container path so the prod file replaces the dev one; if "
                              "both survive the merge, the target paths have diverged and "
                              "which policy is live depends on mount order")
          for failure in failures:
              print(f"::error::{failure}")
          if failures:
              sys.exit(1)
          print("ok:", len(prod), "prod services, each restarting, only web publishing")
          '
      # The guards themselves, driven rather than read. A `${VAR:?}` that was
      # written `${VAR:-}` by a later edit still renders — silently, with the
      # dev password baked into a production cluster — and every text assertion
      # in the server suite would still pass. The only way to know the guard is
      # a guard is to unset the variable and watch the render fail.
      - name: the prod render refuses to produce a document without its credentials
        env:
          TLS_CERT_DIR: /tmp/tls
          PG_TLS_DIR: /tmp/tls
          BACKUP_AGE_RECIPIENT: age1ci0000000000000000000000000000000000000000000000000000000
          BACKUP_REMOTE: /tmp/offhost
        run: |
          set -u
          # The variables are DERIVED from the overlay, not listed here. A
          # hardcoded pair drove two of the six `${…:?}` guards and left the other
          # four — the TLS directories and the two backup knobs — never exercised,
          # while the step's own name claimed the render refuses without its
          # credentials.
          guarded_vars=$(grep -o '\${[A-Z_][A-Z0-9_]*:?' deploy/compose.prod.yaml \
                         | sed 's/^\${//; s/:?$//' | sort -u)
          if [ -z "$guarded_vars" ]; then
            echo "::error::no \${VAR:?} guards found in deploy/compose.prod.yaml at all. \
          This step derives its own subject from that file and has just derived nothing."
            exit 1
          fi
          echo "driving guards: $(echo "$guarded_vars" | tr '\n' ' ')"
          failed=0
          for guarded in $guarded_vars; do
            # Two passes per variable: unset, and set-but-empty. `${VAR:?}` refuses
            # both; `${VAR?}` — one character different — accepts the empty string
            # and would render a production stack with a blank database password.
            for mode in unset empty; do
              # Every guarded variable set to something, except the one under test.
              for name in $guarded_vars; do
                export "$name=ci-not-a-real-value"
              done
              if [ "$mode" = unset ]; then unset "$guarded"; else export "$guarded="; fi
              if output=$(docker compose -f deploy/compose.yaml -f deploy/compose.gpu.yaml \
                   -f deploy/compose.prod.yaml config 2>&1); then
                echo "::error::the prod profile rendered with $guarded $mode. Its \
          \${$guarded:?} guard is missing or written \${$guarded?}, so a production \
          stack would come up on a published default or a blank value."
                failed=1
              # Match compose's own wording rather than the bare name: an unrelated
              # render failure whose message happens to contain the variable name
              # would otherwise be read as the guard firing.
              elif ! printf '%s' "$output" | grep -q "required variable $guarded"; then
                echo "::error::the prod render failed with $guarded $mode, but not on that \
          variable's guard: $(printf '%s' "$output" | head -1)"
                failed=1
              else
                echo "ok: $guarded $mode -> render refused on its own guard"
              fi
            done
          done
          exit "$failed"

  e2e:
    name: playwright story specs + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lineworker/e2e/package-lock.json
      - run: npm ci
        working-directory: lineworker/e2e
      # Playwright transpiles specs with esbuild and never type-checks them,
      # so tsc is the only thing that reads e2e/tsconfig.json. Runs before the
      # stack build so a type error fails in seconds, not after a 15-min image.
      - run: npm run typecheck
        working-directory: lineworker/e2e
      - run: docker compose -f deploy/compose.e2e.yaml up -d --build --wait
        timeout-minutes: 15
      - run: npx playwright install --with-deps chromium
        working-directory: lineworker/e2e
      # PR runs: the PR's declared story spec(s) + the @smoke set (AD-15).
      # Story keys are derived from the branch name and PR labels and only
      # count when a matching spec file exists; if none is derivable the
      # FULL suite runs instead — the gate can narrow, never go vacuous.
      # Story-tag grep is anchored (\b) so @story:1-1 never matches 1-10.
      #
      # **`mode` is decided before anything is derived and written on the way
      # out, unconditionally (Story 8.4).** It used to be echoed from inside the
      # two branches of the `if` below, which made it possible — with one edit,
      # a third branch, an early `return`, or a rename of `$GITHUB_OUTPUT` — for
      # this step to succeed while emitting no `mode` at all. Both run steps
      # below are `if:`-gated on that value, so neither would run, and the job
      # would report green having executed no Playwright at all. That is the
      # precise shape AD-15 calls a gate passing vacuously, and it is the shape
      # Story 8.3's review found in a posture test, so it is closed here rather
      # than argued about: `mode` starts at `full` (the safe answer — run
      # everything), narrows only on evidence, and is written once at the end.
      # The guard step after this one refuses anything else.
      - name: derive story grep (PR)
        if: github.event_name == 'pull_request'
        id: story
        working-directory: lineworker/e2e
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          mode=full
          pattern=""
          candidates=$(printf '%s %s' "$HEAD_REF" "$PR_LABELS" | grep -oE '[0-9]+-[0-9]+' | sort -u || true)
          keys=""
          for k in $candidates; do
            if ls stories/"$k"-*.spec.ts >/dev/null 2>&1; then keys="$keys $k"; fi
          done
          if [ -n "$keys" ]; then
            for k in $keys; do pattern="${pattern}@story:${k}\\b|"; done
            pattern="${pattern}@smoke\\b"
            mode=story
            echo "Derived story keys:$keys"
          else
            echo "No story key derivable from branch/labels — running the FULL e2e suite."
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "grep=$pattern" >> "$GITHUB_OUTPUT"
      # The guard, and it is not belt-and-braces: it is the only thing standing
      # between "both run steps were skipped" and a green tick. A skipped step is
      # a *success* in GitHub Actions, so the failure it protects against has no
      # symptom — the job is green, the required check passes, and no Playwright
      # process ever started.
      #
      # PR-only, because on a push to `main` this step's producer never runs and
      # `mode` is legitimately empty; the full-suite step below is gated on the
      # event rather than on `mode` there, so nothing can be skipped into
      # silence. The `case` was run with all four inputs before shipping —
      # `story` and `full` pass, an empty `mode` and an unrecognised one both
      # print the `::error::` and exit 1 — because a guard nobody has watched
      # fire is a guard nobody knows the shape of.
      - name: the e2e stage picked a suite to run (AD-15)
        if: github.event_name == 'pull_request'
        env:
          MODE: ${{ steps.story.outputs.mode }}
        run: |
          case "$MODE" in
            story|full)
              echo "e2e mode: $MODE"
              ;;
            *)
              echo "::error::the e2e job derived mode '$MODE', which is neither 'story' nor" \
                   "'full'. Both run steps are gated on it, so both would be skipped and this" \
                   "job would report success having run no specs at all (AD-15: a gate that" \
                   "can pass vacuously is not a gate)."
              exit 1
              ;;
          esac
      - name: run story + smoke specs (PR)
        if: github.event_name == 'pull_request' && steps.story.outputs.mode == 'story'
        run: npx playwright test --grep "${{ steps.story.outputs.grep }}"
        working-directory: lineworker/e2e
      # **The merge-to-main stage (AD-15), stated as such.** `github.event_name
      # == 'push'` is `on.push.branches: [main]` — this workflow is triggered by
      # a push to no other branch — so this step *is* the full-suite floor the
      # hardening phase installs: every spec in `e2e/stories`, `workers: 1`,
      # `fullyParallel: false`, a fresh drop/migrate/seed per spec file, against
      # the e2e compose profile with the deterministic model stub.
      #
      # It reads as a fallback because the PR branch shares it, and it is not
      # one. The two conditions are two different claims: on a PR, "no story key
      # was derivable, so narrow to nothing and run everything"; on a push to
      # `main`, "this is the regression floor and narrowing is not an option".
      # Said here because a future edit that made the fallback cheaper — running
      # only `@smoke` when no key is derivable, say — would silently take the
      # merge stage with it.
      - name: run full e2e suite (merge to main; PR with no derivable story key)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && steps.story.outputs.mode == 'full')
        run: npx playwright test
        working-directory: lineworker/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: lineworker/e2e/playwright-report
      - run: docker compose -f deploy/compose.e2e.yaml down -v
        if: always()
