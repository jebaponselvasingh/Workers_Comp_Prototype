# LINEWORKER CI gate (Story 1.1, AD-15).
#
# Provider choice: GitHub Actions — the repo is GitHub-hosted; the CI provider
# is a conventional default, not architecture-pinned (see Story 1.1 Project
# Structure Notes). All four jobs are configured as required checks for merge
# to main (repo settings). Merge to main additionally runs the full e2e suite;
# the sprint-status ↔ e2e/stories bijection lint lands with a later story.

name: ci

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: lineworker

jobs:
  server:
    name: server lint+typecheck+pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: lineworker/server
      # `../deploy` is in scope since the review of Story 6.5. It holds one
      # Python file — `deploy/model-stub/app.py`, the deterministic model the
      # e2e stack runs against — and that file had grown the branch that makes
      # the copilot's write path testable end to end while sitting outside
      # every lint, format and typecheck scope in the repo. Ruff resolves
      # settings from this directory's `pyproject.toml` for paths given on the
      # command line, so the stub is held to the same line length and rule set
      # as `server/` without a second config to keep in step. `mypy` is
      # deliberately not widened: the stub is untyped by design (it answers
      # arbitrary JSON schemas), and annotating it is a change to what it is
      # rather than a check on what it does.
      - run: uv run ruff check . ../deploy && uv run ruff format --check . ../deploy
        working-directory: lineworker/server
      - run: uv run mypy .
        working-directory: lineworker/server
      # AD-11's app-log PHI ban, as a build step (Story 8.2). Beside ruff and
      # mypy rather than inside pytest because it is the same *kind* of thing —
      # a whole-tree static check whose failure names a file and a line — and
      # because a developer who has just written `log.info("x", body=…)` should
      # meet it in the lint step where they are already looking. It also runs
      # in `pytest` via tests/test_log_phi_lint.py, which is what keeps the
      # migrations job covering it too.
      - name: log PHI lint
        run: uv run python -m scripts.lint_log_phi
        working-directory: lineworker/server
      - run: uv run pytest
        working-directory: lineworker/server

  web:
    name: web lint+typecheck+vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lineworker/web/package-lock.json
      # The generated API client is committed, so it can go stale against a
      # changed endpoint signature. Regenerating and diffing turns that into
      # a failed build instead of a runtime surprise (needs Python for the
      # server's OpenAPI dump).
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: lineworker/server
      - run: npm ci
        working-directory: lineworker/web
      - name: check the generated OpenAPI client is up to date
        working-directory: lineworker/web
        run: |
          npm run generate:api
          git diff --exit-code -- src/api/schema.d.ts \
            || { echo "::error::src/api/schema.d.ts is stale — run 'npm run generate:api' and commit it."; exit 1; }
      - run: npm run lint
        working-directory: lineworker/web
      - run: npm run typecheck
        working-directory: lineworker/web
      - run: npm test
        working-directory: lineworker/web

  migrations:
    name: alembic upgrade against fresh DB
    runs-on: ubuntu-latest
    # **No `services:` block, since Story 8.2.** A GitHub service container is
    # created before the first step runs and can therefore only pull an image
    # from a registry — it cannot use one the workflow builds. This job now
    # needs `deploy/postgres`'s image, because migration `0050_pgaudit` runs
    # `CREATE EXTENSION pgaudit` and raises against a server that has not
    # preloaded the library. That refusal is deliberate (a bare upgrade against
    # an unconfigured Postgres must fail loudly rather than skip), which means
    # the job proving "migrations run clean against a fresh database" has to
    # start a configured one.
    #
    # So the database is built and started as ordinary steps below. The flags
    # are `deploy/compose.yaml`'s hardening list, which is also what
    # `tests/test_pgaudit_posture.py` asserts — so those four tests run here
    # rather than skipping, and this job covers the whole AD-11 database
    # posture instead of only the schema.
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
        working-directory: lineworker/server
      - name: build and start the pgaudit test database
        run: |
          docker build -t lineworker/postgres:pg18-pgaudit deploy/postgres
          docker run -d --name lw-ci-pg \
            -e POSTGRES_USER=lineworker -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=lineworker \
            -p 5432:5432 lineworker/postgres:pg18-pgaudit postgres \
            -c shared_preload_libraries=pgaudit \
            -c pgaudit.log=ddl,role \
            -c pgaudit.log_catalog=off \
            -c pgaudit.log_parameter=off \
            -c pgaudit.log_relation=off \
            -c pgaudit.log_statement_once=on \
            -c log_statement=none \
            -c log_duration=off \
            -c log_min_duration_statement=-1 \
            -c log_min_error_statement=panic \
            -c log_parameter_max_length=0 \
            -c log_parameter_max_length_on_error=0 \
            -c logging_collector=on \
            -c log_destination=stderr \
            -c log_directory=log \
            -c log_filename=postgresql-%a.log \
            -c log_rotation_age=1d \
            -c log_rotation_size=0 \
            -c log_truncate_on_rotation=on
          # Bounded, for compose.yaml's `ollama` entrypoint reason: an
          # unbounded wait on a container that died before it listened spins
          # until the job's own timeout with nothing saying why. Sixty tries at
          # one second is far longer than Postgres needs to bind a port, and
          # the container's own logs are printed on the way out — a postmaster
          # that refused to load pgaudit says so there and nowhere else.
          #
          # **Probed from the runner over TCP, not with `docker exec`.** The
          # official image's entrypoint runs an initdb-time temporary server
          # for the init scripts, and that server listens on the container's
          # unix socket with TCP disabled — so `docker exec … pg_isready`
          # succeeds against a postmaster nothing outside the container can
          # reach, and the very next step is `alembic upgrade head` from the
          # runner over `localhost:5432`. The probe has to ask the question the
          # next step asks. `pg_isready` ships with the postgresql-client
          # package the ubuntu runner image already carries; it checks that the
          # port accepts a connection *and* that the server is answering, which
          # a bare TCP knock does not.
          ready=""
          for _ in $(seq 1 60); do
            if pg_isready -h 127.0.0.1 -p 5432 -U lineworker -d lineworker >/dev/null 2>&1; then
              ready=yes
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::the pgaudit test database did not become ready within 60s"
            docker logs lw-ci-pg
            exit 1
          fi
          echo "postgres is ready"
      - run: uv run alembic upgrade head
        working-directory: lineworker/server
        env:
          DATABASE_URL: postgresql://lineworker:ci@localhost:5432/lineworker
      # The whole suite, against a real database.
      #
      # **This used to be a hand-enumerated list of the DB-backed files**, and
      # the trap it set was recorded by Story 2.1, tripped by Story 2.2 and
      # about to be tripped again by 2.3: every `pytestmark = requires_db`
      # module skips silently in the server job above, so a new one that
      # nobody remembered to add here simply never ran, and nothing failed to
      # say so. A green tick that covers less than it looks like is worse
      # than a red one.
      #
      # The fix is to stop maintaining the list. `MIGRATION_TEST_DATABASE_URL`
      # is what turns the skips into runs, so with it set, `pytest` *is* the
      # list — and it stays correct for every story after this one. The cost
      # is that the pure tests run twice across the two jobs (~30 seconds);
      # the alternative cost was coverage nobody could see was missing.
      - run: uv run pytest
        working-directory: lineworker/server
        env:
          MIGRATION_TEST_DATABASE_URL: postgresql://lineworker:ci@localhost:5432/lineworker
      - run: docker rm -f lw-ci-pg
        if: always()

  compose:
    name: compose config (AD-5 port posture)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AD-5's hardest rule is a negative: the model server's port is never
      # published, in any profile. A negative is exactly what nobody notices
      # going missing — a `ports:` line added "just for debugging" reviews as a
      # one-line diff and turns an internal, unauthenticated inference endpoint
      # into a host-reachable one that will happily accept a prompt containing
      # PHI.
      #
      # Rendered with `docker compose config` rather than grepped out of the
      # YAML, because the overlay is the case that matters: a port added in
      # compose.gpu.yaml would not appear in compose.yaml's text at all, and the
      # merged document is the thing that actually runs.
      - name: render the four profiles
        # The prod overlay joined the list with Story 8.2. It cannot be booted
        # here — there are no certificates in version control — but it *can* be
        # rendered, and rendering it is what proves the `${TLS_CERT_DIR:?}`
        # guards, the `ports: !override` on web and the restated postgres
        # `command:` all merge into a document that would start. The two
        # directories are dummy paths: `config` interpolates them and never
        # looks for them.
        env:
          TLS_CERT_DIR: /tmp/tls
          PG_TLS_DIR: /tmp/tls
        run: |
          docker compose -f deploy/compose.yaml config --format json > /tmp/dev.json
          docker compose -f deploy/compose.yaml -f deploy/compose.gpu.yaml config \
            --format json > /tmp/gpu.json
          docker compose -f deploy/compose.e2e.yaml config --format json > /tmp/e2e.json
          docker compose -f deploy/compose.yaml -f deploy/compose.gpu.yaml \
            -f deploy/compose.prod.yaml config --format json > /tmp/prod.json
      # The e2e profile is asserted from the other direction: it must run the
      # deterministic stub and must NOT declare a real model server, or specs
      # would wait on inference and a CI runner would download gigabytes.
      #
      # The prod document is passed to the same check for AD-5's sake: a prod
      # overlay is exactly where somebody eventually publishes the model port
      # "just for the GPU host", and it is the one profile no test in the server
      # suite can boot to notice.
      - name: no published port on the model server
        run: |
          python3 ../.github/scripts/check_model_ports.py \
            /tmp/dev.json /tmp/gpu.json /tmp/e2e.json /tmp/prod.json
      # `ports: !override` on web, asserted against the *rendered* document
      # rather than against the file's text (Story 8.2).
      #
      # Compose appends port lists across files, so without the tag the merged
      # prod stack publishes 8080:80 beside 443 — plain HTTP on the dev port, a
      # healthy `docker compose ps`, and no error anywhere. `server/tests/
      # test_deploy_tls_posture.py` asserts the string `ports: !override` is
      # present, which catches deletion and not a misspelling: `!overide` is a
      # YAML tag compose ignores, and every text assertion in the suite would
      # still pass. The rendered document is the only place the difference
      # shows, and this job is the only thing that renders it.
      - name: the prod ingress publishes 443 and 80 and nothing else
        run: |
          python3 -c '
          import json, sys
          web = json.load(open("/tmp/prod.json"))["services"]["web"]
          published = sorted(str(p.get("published")) for p in web.get("ports", []))
          if published != ["443", "80"]:
              print(f"::error::the rendered prod profile publishes {published} on web, "
                    "expected 443 and 80 only — `ports: !override` has been dropped or "
                    "misspelled and compose has appended the dev mapping.")
              sys.exit(1)
          print("ok: prod web publishes 443 and 80 only")
          '

  e2e:
    name: playwright story specs + smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: lineworker/e2e/package-lock.json
      - run: npm ci
        working-directory: lineworker/e2e
      # Playwright transpiles specs with esbuild and never type-checks them,
      # so tsc is the only thing that reads e2e/tsconfig.json. Runs before the
      # stack build so a type error fails in seconds, not after a 15-min image.
      - run: npm run typecheck
        working-directory: lineworker/e2e
      - run: docker compose -f deploy/compose.e2e.yaml up -d --build --wait
        timeout-minutes: 15
      - run: npx playwright install --with-deps chromium
        working-directory: lineworker/e2e
      # PR runs: the PR's declared story spec(s) + the @smoke set (AD-15).
      # Story keys are derived from the branch name and PR labels and only
      # count when a matching spec file exists; if none is derivable the
      # FULL suite runs instead — the gate can narrow, never go vacuous.
      # Story-tag grep is anchored (\b) so @story:1-1 never matches 1-10.
      - name: derive story grep (PR)
        if: github.event_name == 'pull_request'
        id: story
        working-directory: lineworker/e2e
        env:
          HEAD_REF: ${{ github.head_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          candidates=$(printf '%s %s' "$HEAD_REF" "$PR_LABELS" | grep -oE '[0-9]+-[0-9]+' | sort -u || true)
          keys=""
          for k in $candidates; do
            if ls stories/"$k"-*.spec.ts >/dev/null 2>&1; then keys="$keys $k"; fi
          done
          if [ -n "$keys" ]; then
            pattern=""
            for k in $keys; do pattern="${pattern}@story:${k}\\b|"; done
            echo "grep=${pattern}@smoke\\b" >> "$GITHUB_OUTPUT"
            echo "mode=story" >> "$GITHUB_OUTPUT"
            echo "Derived story keys:$keys"
          else
            echo "mode=full" >> "$GITHUB_OUTPUT"
            echo "No story key derivable from branch/labels — running the FULL e2e suite."
          fi
      - name: run story + smoke specs (PR)
        if: github.event_name == 'pull_request' && steps.story.outputs.mode == 'story'
        run: npx playwright test --grep "${{ steps.story.outputs.grep }}"
        working-directory: lineworker/e2e
      - name: run full e2e suite (main / PR fallback)
        if: github.event_name == 'push' || (github.event_name == 'pull_request' && steps.story.outputs.mode == 'full')
        run: npx playwright test
        working-directory: lineworker/e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: lineworker/e2e/playwright-report
      - run: docker compose -f deploy/compose.e2e.yaml down -v
        if: always()
